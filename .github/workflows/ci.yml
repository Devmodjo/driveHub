# =====================================================================
#  Intégration continue (CI) : à chaque push et à chaque pull request,
#  GitHub compile et teste le backend et le frontend.
#  Une pull request ne doit être fusionnée que si ces deux vérifications sont vertes.
# =====================================================================
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:   # réutilisée par deploy.yml avant chaque déploiement

# Un nouveau push annule la vérification en cours sur la même branche (gain de temps)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests unitaires et d'intégration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Base PostgreSQL temporaire pour les tests d'intégration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: drivehub_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # Valeurs de TEST uniquement (aucun vrai secret ici)
    env:
      DB_URL: jdbc:postgresql://localhost:5432/drivehub_ci
      DB_USERNAME: postgres
      DB_PASSWORD: root
      JWT_SECRET_KEY: ci-0123456789abcdef0123456789abcdef0123456789
      MOCK_ROOT_USERNAME: root@drivehub.test
      MOCK_ROOT_PASSWORD: Root12345
      MAIL_USERNAME: ci@drivehub.test
      MAIL_PASSWORD: unused
      MAIL_HOST: localhost
      MAIL_PORT: "2525"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compiler et tester
        run: ./mvnw -B verify
      - name: Rapport des tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend (build et tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de production
        run: npm run build
      - name: Tests
        run: npx ng test --watch=false
