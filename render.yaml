# =====================================================================
#  Render « Blueprint » : crée en une fois l'API DriveHub ET sa base PostgreSQL.
#  Render > New > Blueprint > choisir ce dépôt > remplir les 3 valeurs demandées > Apply.
#
#  - La base est créée par Render et branchée automatiquement (DB_HOST, DB_PORT, DB_NAME...).
#  - Les clés secrètes (JWT, chiffrement, mot de passe ROOT) sont GÉNÉRÉES par Render :
#    rien à fabriquer soi-même. On les retrouve dans l'onglet « Environment » du service.
#  - Les justificatifs sont stockés (chiffrés) dans la base : aucun autre service à créer.
#  Guide : docs/DEPLOIEMENT.md
# =====================================================================
services:
  - type: web
    name: drivehub-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt            # le plus proche du Cameroun
    plan: starter                # Spring Boot a besoin d'au moins 512 Mo ; l'offre gratuite s'endort après 15 min
    branch: Develop
    autoDeploy: false            # redéploiement lancé par GitHub Actions, seulement si les tests passent
    healthCheckPath: /actuator/health
    envVars:
      # --- Base de données : fournie par Render (voir « databases » plus bas) ---
      - key: DB_HOST
        fromDatabase: { name: drivehub-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: drivehub-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: drivehub-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: drivehub-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: drivehub-db, property: password }

      # --- Secrets générés par Render (copiez DATA_ENCRYPTION_KEY dans un gestionnaire de mots de passe) ---
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: MOCK_ROOT_PASSWORD
        generateValue: true

      # --- Valeurs demandées à la création ---
      - key: MOCK_ROOT_USERNAME      # email du compte administrateur du back-office
        sync: false
      - key: MAIL_USERNAME           # votre adresse Gmail
        sync: false
      - key: MAIL_PASSWORD           # mot de passe d'application Gmail (16 lettres), pas le mot de passe du compte
        sync: false

      # --- Valeurs déjà remplies (modifiables dans Render > Environment) ---
      - key: APP_FRONTEND_URL
        value: https://cmdrivehub.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://cmdrivehub.vercel.app
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: STORAGE_PROVIDER
        value: DATABASE
      - key: PAYMENT_PROVIDER
        value: SIMULATED
      - key: BILLING_ENABLED
        value: "false"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: THYMELEAF_CACHE
        value: "true"

databases:
  - name: drivehub-db
    region: frankfurt
    plan: basic-256mb            # l'offre gratuite de Render supprime la base au bout de 30 jours
