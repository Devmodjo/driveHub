spring:
  config:
    # Variables lues dans backend/.env (copie de backend/.env.example) ; en production, les variables
    # d'environnement du serveur sont prioritaires sur ce fichier.
    import: optional:file:.env[.properties]
  application:
    name: driveHub
  # Connexion PostgreSQL : valeurs lues dans .env (ou les variables d'environnement du serveur).
  # Les valeurs après ":" sont les valeurs par défaut pour le poste de développement.
  # (Remplace configs/DataSourceConfig.java qui avait l'utilisateur et le mot de passe écrits en dur.)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DBNAME:drivehubDB}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # PAS de "default_schema" : Hibernate préfixerait toutes les tables par "public."
        # et le "SET search_path TO <tenant>" de SchemaMultiTenantConnectionProvider serait
        # sans effet (toutes les données métier finissaient dans le schéma public).
        # Les tables globales déclarent leur schéma explicitement : @Table(schema = "public").
        # Le multi-tenant est activé par HibernateMultiTenantConfig (connection provider + resolver).
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/public  # migrations schéma public uniquement
    schemas: public                            # Flyway opère dans public
    baseline-on-migrate: true                 # important car tables existent déjà (false en prod)
    baseline-version: 0
    out-of-order: false
    # repair-on-migrate retiré : il masquait les scripts modifiés après coup (checksum).
    # Règle : ne jamais modifier une migration déjà appliquée, en créer une nouvelle.
  devtools:
    restart:
      enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}   # serveur SMTP (Gmail par défaut, ou Brevo, Mailjet... en production)
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          # Délais en millisecondes : sans eux, un serveur SMTP injoignable bloque l'envoi indéfiniment
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS:true}
            required: ${MAIL_STARTTLS:true}
        debug: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: ${THYMELEAF_CACHE:false}   # true en production

  # Envoi de fichiers (justificatifs) : 5 Mo par fichier, 12 Mo par requête (ajout d'un moniteur : 2 fichiers)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB

server:
  port: ${PORT:8082}                       # les hébergeurs (Render, Railway...) fournissent PORT
  forward-headers-strategy: framework      # derrière le proxy HTTPS de l'hébergeur : vraie adresse et https
  shutdown: graceful                       # termine les requêtes en cours avant un redéploiement

# Santé de l'application : GET /actuator/health -> {"status":"UP"} (rien d'autre n'est exposé)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # Un serveur d'emails indisponible ne doit pas faire déclarer l'API « en panne » (ni la redémarrer)
    mail:
      enabled: false

# Documentation Swagger : à désactiver en production (SWAGGER_ENABLED=false) si l'API n'est pas publique
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

cors:
  # Origines du front autorisées (séparées par des virgules). Ex : https://app.drivehub.cm
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Passer à DEBUG uniquement pour diagnostiquer un problème (très verbeux, ralentit l'application).
logging:
  level:
    org.springframework.security: INFO
    org.springdoc: INFO
    org.springframework.web: INFO
# ------------------------------------------------------------------
#  Paiement Mobile Money
#  provider : SIMULATED (développement, aucun argent ne circule) ou CAMPAY
# ------------------------------------------------------------------
payment:
  provider: ${PAYMENT_PROVIDER:SIMULATED}
  campay:
    base-url: ${CAMPAY_BASE_URL:https://demo.campay.net/api}   # production : https://www.campay.net/api
    username: ${CAMPAY_USERNAME:}
    password: ${CAMPAY_PASSWORD:}
    webhook-key: ${CAMPAY_WEBHOOK_KEY:}

# ------------------------------------------------------------------
#  Chiffrement des données sensibles (justificatifs, numéros de documents)
#  DATA_ENCRYPTION_KEY : 32 octets aléatoires encodés en Base64, générés une seule fois :
#      openssl rand -base64 32
#  À conserver précieusement (gestionnaire de secrets) : sans elle, les données chiffrées sont illisibles.
#  Ne jamais la mettre dans Git. Vérifiée au démarrage.
# ------------------------------------------------------------------
security:
  encryption:
    master-key: ${DATA_ENCRYPTION_KEY:}

# ------------------------------------------------------------------
#  Stockage des justificatifs
#  provider : LOCAL (développement : dossier sur le disque) ou R2 (production : Cloudflare R2)
#  Les fichiers sont chiffrés AVANT d'être envoyés, quel que soit le stockage.
# ------------------------------------------------------------------
storage:
  provider: ${STORAGE_PROVIDER:LOCAL}
  local:
    directory: ${STORAGE_LOCAL_DIR:./data/documents}
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:drivehub-documents}

# ------------------------------------------------------------------
#  Abonnements des auto-écoles (environnement préparé, facturation DÉSACTIVÉE)
#  Voir docs/ABONNEMENTS-ET-PAIEMENTS.md avant d'activer quoi que ce soit.
# ------------------------------------------------------------------
billing:
  enabled: ${BILLING_ENABLED:false}
  trial-days: ${BILLING_TRIAL_DAYS:15}
  default-plan: ESSENTIEL

jwt:
  secret: ${JWT_SECRET_KEY}          # 32 caractères minimum (vérifié au démarrage)
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
app:
  root-admin:
    email: ${MOCK_ROOT_USERNAME}
    password: ${MOCK_ROOT_PASSWORD}
  # Adresse publique du frontend : sert à construire les liens des emails (vérification, invitation...)
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  mail:
    # Expéditeur : une adresse de VOTRE domaine (ex : no-reply@drivehub.cm), autorisée par SPF/DKIM
    # chez le fournisseur d'emails (voir docs/EMAILS-DELIVRABILITE.md). Par défaut : MAIL_USERNAME.
    from: ${MAIL_FROM:${MAIL_USERNAME}}
    from-name: ${MAIL_FROM_NAME:DriveHub}
    reply-to: ${MAIL_REPLY_TO:}              # boîte lue par l'équipe (facultatif)
    support-email: ${SUPPORT_EMAIL:support@drivehub.cm}