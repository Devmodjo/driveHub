spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: driveHub
  datasource:
    url: jdbc:postgresql://localhost:5432/${DBNAME}
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        multiTenancy: SCHEMA
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/public  # migrations schéma public uniquement
    schemas: public                            # Flyway opère dans public
    baseline-on-migrate: true                 # important car tables existent déjà (false en prod)
    baseline-version: 0
    out-of-order: false
    repair-on-migrate: true # en prod
  devtools:
    restart:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false   # true en production

server:
  port: 8082

cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "*"
  allow-credentials: true
  max-age: 3600

logging:
  level:
    org.springframework.security: DEBUG
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
jwt:
  secret: ${JWT_SECRET_KEY}
app:
  root-admin:
    email: ${MOCK_ROOT_USERNAME}
    password: ${MOCK_ROOT_PASSWORD}
  dbname: ${DBNAME}
  frontend-url: http://localhost:4200
  mail:
    from: ${MAIL_USERNAME}