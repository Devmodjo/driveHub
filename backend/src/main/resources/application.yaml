spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: driveHub
  # Connexion PostgreSQL : valeurs lues dans .env (ou les variables d'environnement du serveur).
  # Les valeurs après ":" sont les valeurs par défaut pour le poste de développement.
  # (Remplace configs/DataSourceConfig.java qui avait l'utilisateur et le mot de passe écrits en dur.)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DBNAME:drivehubDB}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # PAS de "default_schema" : Hibernate préfixerait toutes les tables par "public."
        # et le "SET search_path TO <tenant>" de SchemaMultiTenantConnectionProvider serait
        # sans effet (toutes les données métier finissaient dans le schéma public).
        # Les tables globales déclarent leur schéma explicitement : @Table(schema = "public").
        # Le multi-tenant est activé par HibernateMultiTenantConfig (connection provider + resolver).
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/public  # migrations schéma public uniquement
    schemas: public                            # Flyway opère dans public
    baseline-on-migrate: true                 # important car tables existent déjà (false en prod)
    baseline-version: 0
    out-of-order: false
    # repair-on-migrate retiré : il masquait les scripts modifiés après coup (checksum).
    # Règle : ne jamais modifier une migration déjà appliquée, en créer une nouvelle.
  devtools:
    restart:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false   # true en production

server:
  port: 8082

cors:
  # Origines du front autorisées (séparées par des virgules). Ex : https://app.drivehub.cm
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Passer à DEBUG uniquement pour diagnostiquer un problème (très verbeux, ralentit l'application).
logging:
  level:
    org.springframework.security: INFO
    org.springdoc: INFO
    org.springframework.web: INFO
jwt:
  secret: ${JWT_SECRET_KEY}          # 32 caractères minimum (vérifié au démarrage)
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
app:
  root-admin:
    email: ${MOCK_ROOT_USERNAME}
    password: ${MOCK_ROOT_PASSWORD}
  frontend-url: http://localhost:4200
  mail:
    from: ${MAIL_USERNAME}
    from-name: DriveHub