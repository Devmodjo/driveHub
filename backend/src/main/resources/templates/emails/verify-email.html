<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; padding:0; }
        .container { max-width:600px; margin:40px auto; background:#fff; border-radius:8px; padding:40px; }
        .btn { display:inline-block; padding:14px 28px; background:#1a56db; color:white;
               text-decoration:none; border-radius:6px; font-weight:bold; margin:24px 0; }
        .footer { color:#9ca3af; font-size:12px; margin-top:32px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Bienvenue sur DriveHub 👋</h2>
    <p>Bonjour <strong th:text="${name}">Utilisateur</strong>,</p>
    <p>Merci de vous être inscrit. Cliquez sur le bouton ci-dessous pour vérifier votre adresse email :</p>
    <a th:href="${verificationUrl}" class="btn">Vérifier mon email</a>
    <p>Ce lien expire dans <strong>24 heures</strong>.</p>
    <p>Si vous n'avez pas créé de compte, ignorez cet email.</p>
    <div class="footer">© 2026 DriveHub — Tous droits réservés</div>
</div>
</body>
</html>
