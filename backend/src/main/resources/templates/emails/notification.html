<!DOCTYPE html>
<!--
  Modèle générique des emails du workflow (auto-école validée, demande d'adhésion, etc.).
  Variables : name, title, message, actionLabel, actionUrl (le bouton n'apparaît que si actionUrl est fourni).
  Utilisé par EmailService.sendNotification(...).
-->
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">DriveHub</title>
</head>
<body style="margin:0;padding:0;background:#F3F4F6;font-family:'Segoe UI',Arial,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F4F6;padding:40px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;width:100%;background:#FFFFFF;border-radius:12px;border:1px solid #E5E7EB;">
                <!-- En-tête -->
                <tr>
                    <td style="background:#0070F3;padding:28px 40px;border-radius:12px 12px 0 0;">
                        <span style="font-size:24px;font-weight:700;color:#FFFFFF;">DriveHub</span>
                    </td>
                </tr>
                <!-- Contenu -->
                <tr>
                    <td style="padding:40px;">
                        <p style="margin:0 0 8px;font-size:15px;color:#6B7280;">
                            Bonjour <span th:text="${name}">Utilisateur</span>,
                        </p>
                        <h1 style="margin:0 0 20px;font-size:22px;color:#111827;" th:text="${title}">Titre</h1>
                        <p style="margin:0 0 32px;font-size:15px;line-height:1.7;color:#4B5563;" th:text="${message}">Message</p>
                        <p th:if="${actionUrl != null}" style="margin:0 0 8px;">
                            <a th:href="${actionUrl}" th:text="${actionLabel}"
                               style="display:inline-block;background:#0070F3;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;padding:14px 32px;border-radius:8px;">
                                Ouvrir DriveHub
                            </a>
                        </p>
                    </td>
                </tr>
                <!-- Pied de page -->
                <tr>
                    <td style="padding:24px 40px;border-top:1px solid #E5E7EB;font-size:12px;color:#9CA3AF;line-height:1.6;">
                        Vous recevez cet email car vous utilisez DriveHub, la plateforme de gestion d'auto-école.<br/>
                        Contact : support@drivehub.cm
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
