<div class="auth-wrapper">
  <div class="auth-content">
    <div class="card">
      <div class="row align-items-center text-center">
        <div class="col-md-12">
          <div class="card-body">
            <img src="assets/images/logo.png" alt="logo" class="img-fluid mb-2" style="width: 200px; height: auto;" />
            <h4 class="mb-3 f-w-400">Connexion</h4>
            <form [formGroup]="loginForm!" (ngSubmit)="login()" novalidate>
              <div class="input-group mb-3">
                <span class="input-group-text" id="basic-addon1">
                  <i class="feather icon-mail"></i>
                </span>
                <input type="email" class="form-control" formControlName="email" placeholder="exemple@email.com"
                  aria-label="Email" aria-describedby="basic-addon1" [ngClass]="{
                    'is-invalid': loginForm?.get('email')?.invalid && submitted
                  }" formControlName="email" />
                <div class="invalid-feedback" *ngIf="loginForm?.get('email')?.invalid && submitted">
                  {{ getErrorMessage('email') }}
                </div>
              </div>

              <div class="input-group mb-4">
                <span class="input-group-text"><i class="feather icon-lock"></i></span>
                <input [type]="passwordType" formControlName="password" class="form-control" placeholder="Mot de passe"
                  aria-label="Password" [ngClass]="{
                    'is-invalid': loginForm?.get('password')?.invalid && submitted
                  }" formControlName="password" />
                <span class="input-group-text" style="cursor: pointer" (click)="toggleViewPasswordBtn()">
                  <i class="feather" [ngClass]="passwordType === 'password' ? 'icon-eye' : 'icon-eye-off'"></i>
                </span>
                <div class="invalid-feedback" *ngIf="loginForm?.get('password')?.invalid && submitted">
                  {{ getErrorMessage('password') }}
                </div>
              </div>

              <div class="form-group text-start mt-2">
                <div class="checkbox checkbox-primary d-inline">
                  <input type="checkbox" formControlName="rememberMe" name="checkbox-fill-1" id="checkbox-fill-a1"
                    checked />
                  <label for="checkbox-fill-a1" class="cr">Se souvenir de moi</label>
                </div>
              </div>

              <div class="d-grid">
                <button
                  type="submit"
                  class="btn btn-block btn-primary mb-4"
                  [disabled]="isLoading">
                  <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                  Se connecter
                </button>
              </div>


              <p class="mb-2 text-muted">
                Mot de passe oublié?
                <a href="javascript:" class="f-w-400">Réinitialiser</a>
              </p>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
