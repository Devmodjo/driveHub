<div class="fixed inset-0 z-[90] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm sm:p-6">
  <div role="dialog" aria-modal="true" [attr.aria-label]="title"
       class="w-full sm:max-w-lg max-h-[95vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl bg-white dark:bg-[#0c0c0c] border border-black/5 dark:border-white/10 shadow-2xl animate-expand">

    <!-- En-tête : icône de succès + textes -->
    <div class="flex flex-col items-center text-center px-6 pt-8 pb-6 border-b border-black/5 dark:border-white/10">
      <div class="flex items-center justify-center w-14 h-14 rounded-2xl bg-[#0070f3]/10 text-[#0070f3] mb-5">
        <svg [lucideIcon]="icons.Check" [size]="28" [strokeWidth]="2.5" />
      </div>
      <h2 class="font-display text-2xl font-black tracking-tight text-black dark:text-white mb-2">{{ title }}</h2>
      <p class="text-sm text-black/60 dark:text-white/60 leading-relaxed max-w-sm">{{ message }}</p>
      <app-spam-hint class="mt-3 max-w-sm text-left" />
    </div>

    <div class="px-6 py-6 flex flex-col gap-5">
      @if (password) {
        <div class="flex flex-col gap-3">
          <p class="field-label mb-0!">Mot de passe provisoire</p>

          <!-- Mot de passe (flouté tant qu'il n'est pas affiché) + boutons -->
          <div class="flex items-center gap-2 rounded-2xl border border-black/10 dark:border-white/10 bg-black/[0.02] dark:bg-white/[0.03] pl-4 pr-1.5 py-1.5">
            <span class="grow min-w-0 truncate font-mono text-lg font-bold tracking-[0.15em] text-black dark:text-white"
                  [class.blur-sm]="!isPasswordVisible()" [class.select-none]="!isPasswordVisible()">
              {{ isPasswordVisible() ? password : '••••••••••' }}
            </span>
            <button type="button" class="bo-icon-btn" (click)="togglePassword()"
                    [attr.aria-label]="isPasswordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
              <svg [lucideIcon]="isPasswordVisible() ? icons.EyeOff : icons.Eye" [size]="18" />
            </button>
            <button type="button" class="bo-icon-btn bg-[#0070f3] text-white hover:bg-[#0051af] dark:text-white dark:hover:bg-[#0051af]"
                    (click)="copyPassword()" aria-label="Copier le mot de passe">
              <svg [lucideIcon]="copySuccess() ? icons.Check : icons.Copy" [size]="18" />
            </button>
          </div>
          @if (copySuccess()) {
            <p class="text-sm font-semibold text-emerald-600 dark:text-emerald-400" role="status">Mot de passe copié.</p>
          }

          <div class="flex items-start gap-2 rounded-xl border border-amber-500/30 bg-amber-500/10 px-4 py-3 text-xs text-amber-800 dark:text-amber-200">
            <svg [lucideIcon]="icons.TriangleAlert" [size]="16" class="shrink-0 mt-0.5" />
            <p>Copiez ce mot de passe maintenant : <strong>il ne pourra plus être récupéré</strong> une fois cette fenêtre fermée.</p>
          </div>
        </div>
      }

      <button type="button" class="btn-primary w-full min-h-12" (click)="goToLogin()">
        J'ai compris, aller à la connexion
      </button>
    </div>
  </div>
</div>
