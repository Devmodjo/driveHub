<!-- ── BARRE DU HAUT (mobile et tablette, masquée à partir de lg:) ── -->
<header class="lg:hidden sticky top-0 z-40 flex items-center justify-between gap-3 h-16 px-3 sm:px-5 bg-white/90 dark:bg-black/90 backdrop-blur border-b border-black/5 dark:border-white/10">
  <button type="button" class="bo-icon-btn" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()"
          aria-controls="bo-sidebar" aria-label="Ouvrir le menu">
    <svg [lucideIcon]="icons.Menu" [size]="24" />
  </button>
  <a routerLink="/backoffice/dashboard/overview" class="flex items-center gap-2 min-w-0">
    <span class="text-xl font-black italic tracking-tighter"><span class="text-[#0070f3]">Drive</span>Hub</span>
    <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-black/40 dark:text-white/40">Admin</span>
  </a>
  <button type="button" class="bo-icon-btn" (click)="toggleTheme()" aria-label="Changer de thème">
    <svg [lucideIcon]="isDark ? icons.Sun : icons.Moon" [size]="20" />
  </button>
</header>

<!-- Voile sombre derrière le tiroir mobile : un clic le referme -->
@if (isMenuOpen()) {
  <div class="lg:hidden fixed inset-0 z-40 bg-black/50 backdrop-blur-[2px]" (click)="isMenuOpen.set(false)" aria-hidden="true"></div>
}

<!-- ── BARRE LATÉRALE : tiroir sur mobile, fixe à partir de lg: ── -->
<aside id="bo-sidebar"
       class="fixed inset-y-0 left-0 z-50 flex w-72 max-w-[85vw] flex-col bg-white dark:bg-black border-r border-black/5 dark:border-white/10 transition-transform duration-300 lg:translate-x-0"
       [class.-translate-x-full]="!isMenuOpen()" [class.translate-x-0]="isMenuOpen()">

  <!-- Logo + fermeture (mobile) -->
  <div class="flex items-center justify-between gap-2 px-5 h-16 lg:h-20 shrink-0">
    <a routerLink="/backoffice/dashboard/overview" class="flex items-center gap-3 min-w-0" (click)="isMenuOpen.set(false)">
      <div class="relative w-10 h-10 shrink-0 rounded-xl overflow-hidden bg-black border border-black/5 dark:border-white/10">
        <img src="/dh_icon.png" alt="" class="absolute inset-0 w-full h-full object-cover" />
      </div>
      <div class="flex flex-col min-w-0">
        <span class="text-xl font-black italic tracking-tighter leading-none"><span class="text-[#0070f3]">Drive</span>Hub</span>
        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-black/40 dark:text-white/40 leading-none mt-1">Back-office</span>
      </div>
    </a>
    <button type="button" class="bo-icon-btn lg:hidden" (click)="isMenuOpen.set(false)" aria-label="Fermer le menu">
      <svg [lucideIcon]="icons.X" [size]="22" />
    </button>
  </div>

  <!-- Liens -->
  <nav class="grow overflow-y-auto px-3 py-2" aria-label="Navigation du back-office">
    <p class="px-3 pb-2 text-[10px] font-black uppercase tracking-[0.2em] text-black/35 dark:text-white/35">Navigation</p>
    <ul class="flex flex-col gap-1">
      @for (link of navLinks(); track link.route) {
        <li>
          <a [routerLink]="link.route" routerLinkActive="bg-[#0070f3]/10! text-[#0070f3]!" (click)="isMenuOpen.set(false)"
             class="flex items-center gap-3 min-h-11 px-3 rounded-xl text-sm font-semibold text-black/70 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
            <svg [lucideIcon]="link.icon" [size]="18" class="shrink-0" />
            <span>{{ link.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Pied : thème, profil, déconnexion -->
  <div class="shrink-0 border-t border-black/5 dark:border-white/10 p-3 space-y-1">
    <button type="button" (click)="toggleTheme()"
            class="hidden lg:flex w-full items-center gap-3 min-h-11 px-3 rounded-xl text-sm font-semibold text-black/70 dark:text-white/70 hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
      <svg [lucideIcon]="isDark ? icons.Sun : icons.Moon" [size]="18" />
      {{ isDark ? 'Mode clair' : 'Mode sombre' }}
    </button>

    <div class="flex items-center gap-2">
      <button type="button" (click)="openProfile()" [disabled]="!adminProfile()"
              class="flex grow min-w-0 items-center gap-3 min-h-12 px-2 rounded-xl text-left hover:bg-black/5 dark:hover:bg-white/5 transition-colors"
              aria-label="Ouvrir mon profil">
        <span class="w-9 h-9 shrink-0 rounded-xl bg-[#0070f3] text-white flex items-center justify-center text-sm font-black">{{ userInitials() }}</span>
        <span class="flex flex-col min-w-0">
          <span class="text-sm font-bold text-black dark:text-white truncate">{{ adminProfile()?.name ?? 'Chargement...' }}</span>
          <span class="text-xs text-black/50 dark:text-white/50 truncate">{{ roleLabel(adminProfile()?.role) || 'Mon profil' }}</span>
        </span>
      </button>
      <button type="button" class="bo-icon-btn bo-btn-ghost-red" (click)="logout()" aria-label="Se déconnecter" title="Se déconnecter">
        <svg [lucideIcon]="icons.LogOut" [size]="18" />
      </button>
    </div>
  </div>
</aside>

@if (isProfileOpen() && adminProfile()) {
  <bo-profile-panel [admin]="adminProfile()!" (closed)="isProfileOpen.set(false)" (updated)="adminProfile.set($event)" />
}
