<!-- Mobile : graphiques empilés ; à partir de lg: : côte à côte (barres plus larges que l'anneau) -->
<div class="grid grid-cols-1 lg:grid-cols-5 gap-4 sm:gap-5 mb-6">

  <section class="bo-card p-4 sm:p-5 lg:col-span-3 min-w-0">
    <h3 class="bo-section-title">Inscriptions par mois</h3>
    <p class="text-xs text-black/50 dark:text-white/50 mt-0.5 mb-4">
      Année en cours. Mois précédents estimés : l'API ne fournit pas encore l'historique mensuel.
    </p>
    <div class="relative h-52 sm:h-60">
      <canvas #barChart baseChart type="bar" [data]="barChartData" [options]="barChartOptions"></canvas>
    </div>
  </section>

  <section class="bo-card p-4 sm:p-5 lg:col-span-2 min-w-0">
    <h3 class="bo-section-title mb-4">Répartition par statut</h3>
    <div class="flex flex-col sm:flex-row lg:flex-col xl:flex-row items-center gap-5">
      <div class="relative w-40 h-40 shrink-0">
        <canvas #doughnutChart baseChart type="doughnut" [data]="doughnutChartData" [options]="doughnutChartOptions"></canvas>
        @if (stats) {
          <div class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center">
            <span class="font-display text-2xl font-black text-black dark:text-white">{{ stats.totalRegistries }}</span>
            <span class="text-[10px] font-bold uppercase tracking-[0.15em] text-black/40 dark:text-white/40">total</span>
          </div>
        }
      </div>
      <ul class="w-full grid grid-cols-2 sm:grid-cols-1 lg:grid-cols-2 xl:grid-cols-1 gap-2">
        @for (item of legendItems; track item.label) {
          <li class="flex items-center gap-2 text-sm min-w-0">
            <span class="w-2.5 h-2.5 shrink-0 rounded-full" [style.backgroundColor]="item.color"></span>
            <span class="text-black/60 dark:text-white/60 truncate">{{ item.label }}</span>
            <span class="ml-auto font-bold text-black dark:text-white">{{ item.value }}</span>
          </li>
        }
      </ul>
    </div>
  </section>

</div>
