<div class="modal-overlay">
  <div class="modal-content corporate-modal rounded-2xl shadow-xl flex flex-col items-center p-8 bg-white max-w-md w-full mx-4">
    
    <!-- Icone de succès (SVG) -->
    <div class="mb-5 rounded-full bg-green-100 p-4">
      <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <!-- Titre et Message -->
    <h2 class="text-2xl font-bold text-gray-800 mb-2 text-center">{{ title }}</h2>
    <p class="text-center text-gray-600 mb-8 text-sm leading-relaxed">
      {{ message }}
    </p>

    <!-- Zone Mot de passe (Si présent) -->
    @if(password) {
      <div class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 mb-8 flex flex-col gap-3 relative">
        <span class="text-[11px] text-slate-500 font-bold uppercase tracking-wider">Votre mot de passe provisoire</span>
        
        <div class="flex items-center justify-between bg-white border border-slate-300 rounded-lg p-3 shadow-sm">
          <span class="font-mono text-slate-800 tracking-[0.2em] text-lg" [class.blur-sm]="!isPasswordVisible" [class.select-none]="!isPasswordVisible">
            {{ isPasswordVisible ? password : '••••••••••••' }}
          </span>
          
          <div class="flex gap-2">
            <!-- Bouton Afficher/Masquer -->
            <button type="button" (click)="togglePassword()" class="text-slate-400 hover:text-slate-700 p-1.5 transition-colors" title="Afficher/Masquer">
              @if(isPasswordVisible) {
                <!-- Icone Oeil ouvert -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.543 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
              } @else {
                <!-- Icone Oeil barré -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
              }
            </button>
            
            <!-- Bouton Copier -->
            <button type="button" (click)="copyPassword()" class="text-blue-500 hover:text-blue-700 p-1.5 transition-colors relative" title="Copier">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
              
              @if(copySuccess) {
                <span class="absolute -top-10 -left-6 bg-slate-800 text-white text-[10px] px-2.5 py-1 rounded shadow-lg font-medium tracking-wide">COPIÉ</span>
              }
            </button>
          </div>
        </div>
      </div>
    }

    <!-- Action -->
    <button (click)="goToLogin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3.5 rounded-xl transition-all shadow hover:shadow-lg">
      J'ai compris, me connecter
    </button>
    
  </div>
</div>
