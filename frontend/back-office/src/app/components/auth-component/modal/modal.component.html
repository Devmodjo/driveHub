<div class="fixed inset-0 z-[9999] flex items-center justify-center bg-gray-900/70 backdrop-blur-md p-4 sm:p-8 overflow-auto modal-overlay">

  <!-- Boîte Modale Principale -->
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg flex flex-col my-auto relative modal-box overflow-hidden">

    <!-- Header — bande supérieure avec fond très léger -->
    <div class="flex flex-col items-center px-8 pt-10 pb-8 border-b border-gray-100">

      <!-- Icône succès -->
      <div class="flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-50 mb-6">
        <svg class="w-7 h-7 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
      </div>

      <!-- Textes -->
      <h2 class="text-2xl font-bold text-gray-900 mb-2 tracking-tight text-center">{{ title }}</h2>
      <p class="text-sm text-gray-500 leading-relaxed text-center max-w-sm">{{ message }}</p>
    </div>

    <!-- Corps de la modale -->
    <div class="px-8 py-7 flex flex-col gap-5">

      <!-- Zone mot de passe (conditionnelle) -->
      @if(password) {

        <!-- Bloc identifiant -->
        <div class="flex flex-col gap-3">

          <!-- Label -->
          <div class="flex items-center gap-2.5">
            <span class="inline-flex items-center px-2.5 py-1 bg-gray-900 text-white text-[10px] font-bold uppercase tracking-widest rounded-full leading-none">
              Important
            </span>
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Identifiant Temporaire</span>
          </div>

          <!-- Carte mot de passe -->
          <div class="flex items-center justify-between gap-3 bg-gray-50 border border-gray-200 rounded-2xl px-5 py-4">

            <!-- Valeur -->
            <div class="flex-1 overflow-x-auto overflow-y-hidden hide-scrollbar">
              <span
                class="inline-block font-mono text-xl font-bold text-gray-900 tracking-[0.18em] password-text whitespace-nowrap"
                [class.blur-sm]="!isPasswordVisible"
                [class.select-none]="!isPasswordVisible">
                {{ isPasswordVisible ? password : '••••••••••••' }}
              </span>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2 shrink-0">

              <!-- Bouton Œil -->
              <button
                type="button"
                (click)="togglePassword()"
                class="btn-icon flex items-center justify-center w-9 h-9 rounded-xl bg-white border border-gray-200 text-gray-500 hover:bg-gray-100 hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-300 shadow-sm"
                title="Afficher / Masquer">
                @if(isPasswordVisible) {
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.543 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                } @else {
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                  </svg>
                }
              </button>

              <!-- Bouton Copier -->
              <div class="relative">
                <button
                  type="button"
                  (click)="copyPassword()"
                  class="btn-icon flex items-center justify-center w-9 h-9 rounded-xl bg-blue-600 hover:bg-blue-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm"
                  title="Copier le mot de passe">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                  </svg>
                </button>

                <!-- Tooltip "Copié !" -->
                @if(copySuccess) {
                  <div class="absolute -top-12 left-1/2 min-w-max tooltip-anim z-10">
                    <div class="bg-gray-900 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow-xl flex items-center gap-1.5 border border-gray-700">
                      <svg class="w-3.5 h-3.5 text-green-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                      </svg>
                      Copié !
                    </div>
                  </div>
                }
              </div>

            </div>
          </div>

          <!-- Alerte sécurité -->
          <div class="flex items-start gap-3 px-4 py-3.5 bg-amber-50 border border-amber-200 rounded-xl">
            <svg class="w-4 h-4 shrink-0 text-amber-500 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <p class="text-xs text-amber-800 leading-relaxed">
              Copiez ce mot de passe maintenant. Par mesure de sécurité,
              <strong class="font-semibold">il ne pourra plus être récupéré une fois cette fenêtre fermée.</strong>
            </p>
          </div>

        </div>
      }

      <!-- Bouton CTA -->
      <button
        (click)="goToLogin()"
        class="btn-cta w-full bg-gray-900 hover:bg-black text-white text-sm font-semibold py-3.5 rounded-xl focus:outline-none focus:ring-4 focus:ring-gray-300 shadow-md mt-1">
        J'ai compris — Fermer la fenêtre
      </button>

    </div>
  </div>
</div>
